<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مصاريفي · Msarifi</title>
<meta name="description" content="مصاريفي: تسيير الفلوس ديالك بالدارجة. Dépenses, budget, crédits, créances, actifs, location.">
<meta name="theme-color" content="#0b0f1a" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem('msarifi.theme');if(localStorage.getItem('msarifi.priv')==='1')document.documentElement.dataset.priv='1';if(t)document.documentElement.dataset.theme=t;else if(matchMedia('(prefers-color-scheme: light)').matches)document.documentElement.dataset.theme='light'}catch(e){}try{var L=localStorage.getItem('msarifi.lang');if(['ar','en','fr'].indexOf(L)<0){L='ar';var n=navigator.languages||[navigator.language||''];for(var i=0;i<n.length;i++){var c=String(n[i]).slice(0,2).toLowerCase();if(c==='ar'||c==='en'||c==='fr'){L=c;break}}}document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr'}catch(e){}</script>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><div class="logo">م</div><div><h1>مصاريفي</h1><small id="hello">فين كيمشي الصالير؟</small></div></div>
    <div class="row">
      <button class="icon-btn press" id="privBtn" aria-label="خبي الأرقام" aria-pressed="false"></button>
      <button class="icon-btn press" id="settingsBtn" aria-label="Paramètres"></button>
    </div>
  </header>
  <main>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-tx"></section>
    <section class="view" id="v-budget"></section>
    <section class="view" id="v-debts"></section>
    <section class="view" id="v-wealth"></section>
  </main>
</div>
<button class="fab" id="fab" aria-label="زيد مصروف"></button>
<nav class="tabs" id="tabs"></nav>
<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
